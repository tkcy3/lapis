<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1430">
<title>LAPIS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かな夜空のように落ち着いた、のんびり遊べるパズル
   IDEA: 重力の中心を回る星々。チリが集まって惑星・恒星・銀河へ育つ
   PICTURE: 盤面そのもの。ゆっくり公転する星が軌道に並ぶ
   COLOUR/TYPE: 深い藍色の宇宙(真っ黒ではなく青みを残す)・フラットな単色・色とりどりの星 + 彗星(＋)とワームホール(－) / M PLUS Rounded 1c 太字
   LAYOUT: 上に点数、中央に環、下にNEXT・加護・KEEP(片手で届く位置) */
:root{--bg1:#0f1430;--bg2:#0a0e22;--ink:#e4e8f4;--sub:#8b94bb;--panel:#151b3a;--btn:#222a50;--line:rgba(255,255,255,.08);--acc:#d9705f;--f:'M PLUS Rounded 1c',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font:16px/1.5 var(--f);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
#achT{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));z-index:30;display:flex;gap:10px;align-items:center;min-width:250px;max-width:92vw;background:rgba(20,28,72,.96);border:1px solid rgba(216,189,106,.65);border-radius:14px;padding:8px 14px;color:#e9ecf8;box-shadow:0 6px 24px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 40px));visibility:hidden;transition:transform .4s,visibility 0s .4s;pointer-events:none}
#achT.show{transform:translate(-50%,0);visibility:visible;transition:transform .4s}
#achT .ai{font-size:28px}#achT small{display:block;font-size:11px;color:#d8bd6a}#achT b{display:block;font-size:15px}#achT i{display:block;font-style:normal;font-size:12px;color:#aab5d8}
.am{display:flex;align-items:center;gap:10px;margin:6px 0 12px}.am div{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.am i{display:block;height:100%;background:#d8bd6a;border-radius:4px}.am b{font-size:14px;color:#d8bd6a}
.ag{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.as{font-size:12px;color:var(--sub);margin:12px 0 6px;text-align:left}
.at{aspect-ratio:1;border:0;border-radius:12px;background:var(--btn);font-size:24px;color:var(--ink);display:grid;place-items:center;padding:0}.at.lock{opacity:.32;filter:grayscale(1);font-size:18px}.at.sel{box-shadow:0 0 0 2px #d8bd6a inset}
.ad{min-height:58px;margin:12px 0 4px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;color:#c9d0ea;text-align:left;line-height:1.5}.ad b{color:#e9ecf8}.ad small{color:#d8bd6a}
#sky,#fly{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#warn{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(ellipse 85% 72% at 50% 46%,rgba(0,0,0,0) 44%,rgba(130,22,40,.46) 78%,rgba(180,38,48,.78) 100%)}
#app{position:fixed;z-index:1;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;max-width:560px;margin:0 auto}
header{width:100%;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
#maxc{width:44px;height:44px}
.sc{text-align:center;line-height:1.1}
#score{font-weight:800;font-size:36px;font-variant-numeric:tabular-nums;transition:transform .15s}
#score.bump{transform:scale(1.12)}
#bestl{font-size:13px;color:var(--sub)}
.ib{width:48px;height:48px;border:0;border-radius:14px;background:transparent;color:var(--ink);display:grid;place-items:center;justify-self:end}
.ib svg{width:26px;height:26px}
#tip{position:relative;align-self:stretch;height:56px;flex:none;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:16px;line-height:1.4;font-weight:800;color:#dfe8f1;text-align:center;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}   /* 高さは2行ぶんで固定(文の長さで盤が上下に動かないように) */
#tip small{font-size:13px;font-weight:600;color:var(--sub)}
#tip button{position:absolute;right:12px;top:100%;margin-top:2px;z-index:3;border:0;background:rgba(255,255,255,.06);color:var(--sub);font:500 13px var(--f);padding:5px 11px;border-radius:10px}   /* スキップは文の流れに入れず、盤の右上の角に */
#wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
#cv{touch-action:none;display:block}
footer{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:8px 10px calc(14px + env(safe-area-inset-bottom))}
.next{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border-radius:16px;padding:6px 10px}
.next span{font-size:12px;font-weight:800;color:var(--sub);writing-mode:vertical-rl;letter-spacing:.05em}
#nextl{display:flex;gap:4px}
#nextl canvas{width:44px;height:44px}
#keepl{display:flex;gap:4px}#keepl canvas{width:44px;height:44px}.keep{cursor:pointer;transition:opacity .2s,box-shadow .3s}.keep.off{opacity:.42}
.keep.hint{animation:keepHint 1.2s ease-in-out infinite}.keep.tut{animation:keepTut 1.1s ease-in-out infinite}@keyframes keepTut{0%,100%{box-shadow:0 0 0 1.5px rgba(216,189,106,.35) inset}50%{box-shadow:0 0 0 2.5px rgba(216,189,106,.95) inset,0 0 16px rgba(216,189,106,.35)}}@keyframes keepHint{0%,100%{box-shadow:0 0 0 1.5px rgba(255,170,140,.25) inset}50%{box-shadow:0 0 0 2px rgba(255,170,140,.85) inset,0 0 14px rgba(255,140,110,.35)}}
#perkl{display:grid;grid-template-columns:repeat(2,26px);gap:5px;justify-content:center;align-content:center}   /* 加護は最大4つ → 2×2で並べる(縦一列に伸びて盤を押し上げないように) */
.pk{position:relative;width:26px;height:26px;padding:0;border-radius:8px;border:0;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--ink)}
.pk svg{width:17px;height:17px}
#perkl .pk b{right:-6px;top:-6px;min-width:15px;height:15px;border-radius:8px;font-size:10px;line-height:15px;padding:0 3px}
.pk b,.ub b{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#c9cfe4;color:#0f1430;font-size:12px;line-height:20px;text-align:center;padding:0 4px}
.ub{position:relative;width:64px;height:64px;border:0;border-radius:20px;background:var(--btn);color:var(--ink);display:grid;place-items:center}
.ub svg{width:30px;height:30px}
.ub:disabled{opacity:.4}
.ub:active,.btn:active,.pk:active{filter:brightness(1.15)}
.ov{position:fixed;inset:0;background:rgba(4,6,16,.78);display:none;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));z-index:10}
.ov.on{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 18px;width:min(100%,390px);max-height:88vh;overflow:auto;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.panel h2{margin:0 0 4px;font-size:30px;font-weight:800;line-height:1.1}
.panel p{margin:6px 0;color:#d6e0ea}
.small{font-size:13px;color:var(--sub)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-weight:800}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;gap:3px}
.seg button{min-width:48px;min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--sub);font:800 15px var(--f)}
.seg button.on{background:var(--acc);color:#fff}
.plain{display:block;width:100%;min-height:44px;margin-top:6px;border:0;background:transparent;color:var(--sub);font:500 15px var(--f)}
.cs{text-align:left;font-size:14px;line-height:1.55;color:#d6e0ea;margin-top:8px}
.cs h3{font-size:15px;margin:12px 0 2px;color:var(--ink)}
.cs ul,.log ul{margin:2px 0;padding-left:1.2em}
.csChk{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;font-weight:800}
.csChk input{width:22px;height:22px;accent-color:var(--acc)}
.btn:disabled{opacity:.45}
.btn{display:block;width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);font:800 18px var(--f)}
.btn.pri{background:var(--acc);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perk{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:72px;margin-top:10px;border:0;border-radius:16px;background:var(--btn);color:var(--ink);padding:10px 14px;font-family:var(--f)}
.perk svg{width:36px;height:36px;flex:none}
.perk b{display:block;font-size:18px}
.perk span{display:block;font-size:14px;color:#d6e0ea;line-height:1.35}
.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.gal canvas{width:100%;aspect-ratio:1;display:block}
.gi span{display:block;font-size:11px;line-height:1.25;color:var(--sub);min-height:2.5em;overflow-wrap:anywhere}
.big{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line);font-size:15px}
.log{text-align:left;font-size:14px;color:#d6e0ea}
#bigc{width:120px;height:120px;display:block;margin:6px auto}
/* タイトル画面(KROPKI・Dungeon Chainと同じ流れ: タイトル → ゲーム) */
#title{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom))}
#title.on{display:flex}
body.onTitle #app{visibility:hidden}
.tPortal{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:14px;background:var(--btn);color:var(--ink);font:800 16px var(--f);text-decoration:none}
.tHero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
#tCv{width:min(70vw,290px);height:min(70vw,290px);max-height:38vh;max-width:38vh}
.tLogo{font-size:46px;font-weight:800;letter-spacing:.14em;line-height:1;margin:6px 0 0 .14em}
#chap{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;opacity:0;color:#e9ecf8}
#chap small{display:block;font:600 13px var(--f);letter-spacing:.35em;color:#d8bd6a;margin-bottom:4px}
#chap b{font:800 24px var(--f);letter-spacing:.12em}
#ovr .chl,.ovr .chl{color:#d8bd6a;letter-spacing:.2em}
#chap.on{animation:chap 3.4s ease forwards}
@keyframes chap{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.chg h3{font-size:15px;margin:10px 0 4px;color:#e0bd6a;text-align:left}.chg details{margin:0 0 4px;text-align:left}.chg summary{font-size:14px;color:var(--sub);padding:8px 0;cursor:pointer}
#ver{margin-top:6px;background:none;border:0;color:var(--sub);font:500 14px var(--f);padding:6px 10px;min-height:36px}
#ver.new{color:#e0bd6a;font-weight:800}
.tBest{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:15px;min-height:40px;line-height:1.45;text-align:left}.tBest span{white-space:nowrap}
.tBest canvas{width:36px;height:36px}
.tBest b{color:var(--ink)}
.tMain,.tSub{width:100%;max-width:380px}
.tSub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tSub button,.tile{min-height:76px;border:0;border-radius:16px;background:var(--btn);color:var(--ink);font:800 14px var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px}
.tSub svg,.tile svg{width:26px;height:26px}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pics.sm canvas{width:24px;height:24px}
.btn.danger{background:rgba(217,112,95,.16);color:#f2a493}
#a2hChip{display:flex;width:100%;max-width:380px;margin-top:12px;border-radius:14px;background:var(--panel);overflow:hidden;text-align:left}
#a2hChip button{background:none;border:0;color:var(--ink);font-family:var(--f)}
#a2hGo{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px}
#a2hGo b{display:block;font-size:15px}#a2hGo small{display:block;font-size:12px;color:var(--sub);font-weight:500}#a2hGo i{margin-left:auto;font-style:normal;color:var(--sub)}
#a2hX{width:48px;color:var(--sub);font-size:18px}
.hidden{display:none!important}
/* 設定(KROPKIと同じ、横並びの切り替え) */
.set .srow{margin:0;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
.set .srow small{display:block}
.rowBtn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:800 16px var(--f);padding:0 2px;text-align:left}
.rowBtn .rs{color:var(--sub);font-weight:500}
.dbtn{border:0;border-radius:10px;background:rgba(217,112,95,.16);color:#f2a493;font:800 15px var(--f);min-height:42px;padding:0 16px}
.newb{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:8px;background:#e0bd6a;color:#141a3a;font-size:11px;font-weight:800;vertical-align:middle}
.lk{background:none;border:0;color:var(--sub);font:500 13px var(--f);padding:2px 0;text-decoration:underline}
/* 遊び方(文章でなく図で) */
.hrow{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.pics{display:flex;align-items:center;flex:none;min-width:112px;justify-content:center}
.pics canvas{width:30px;height:30px}
.pics i{font-style:normal;color:var(--sub);margin:0 3px}
.pics svg{width:30px;height:30px}
.hrow p{margin:0;font-size:15px;line-height:1.45;color:#d6e0ea}
.chip{display:inline-block;padding:3px 10px;border-radius:10px;background:var(--btn);font-size:13px}
/* ホーム画面に追加の案内(初めてブラウザで開いたとき) */
#instOv{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.instBox{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.instBox img{width:96px;height:96px;border-radius:22px;margin-bottom:12px}
.instBox h1{margin:0 0 14px;font-size:34px;letter-spacing:.14em;font-weight:800}
.instLead{margin:0 0 16px;font-size:19px;font-weight:800;line-height:1.5}
.instFx{list-style:none;margin:0 0 22px;padding:12px 16px;width:100%;border-radius:14px;background:var(--panel);text-align:left}
.instFx li{display:flex;gap:10px;font-size:15px;padding:5px 0}
.a2h{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.a2h b{border:2px solid var(--acc);border-radius:10px;padding:7px 12px;font-size:16px}
.a2note{font-size:14px;color:var(--sub);margin:4px 0 0}
.instSkip{margin-top:22px;background:none;border:0;color:var(--sub);font:500 15px var(--f);text-decoration:underline;padding:10px;min-height:44px}
.rv{opacity:0;animation:rv .7s ease-out forwards}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ovr h2{font-size:26px;margin-top:4px}
.nfr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 6px}.nfr span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);width:64px}.nfr canvas{width:34px;height:34px}.nfr.many{gap:4px;max-width:330px;margin-left:auto;margin-right:auto}.nfr.many span{width:auto}.nfr.many canvas{width:28px;height:28px}
</style>
</head>
<body>
<canvas id="sky"></canvas><canvas id="fly"></canvas><div id="warn"></div><div id="achT"></div>
<div id="app">
  <header>
    <canvas id="maxc" aria-label="いちばん大きい星"></canvas>
    <div class="sc"><div id="score">0</div><div id="bestl">BEST 0</div></div>
    <button class="ib" id="menuB" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="tip"></div>
  <div id="wrap"><canvas id="cv"></canvas><div id="chap"></div></div>
  <footer>
    <div class="next"><span>NEXT</span><div id="nextl"></div></div>
    <div id="perkl"></div>
    <div class="next keep" id="keepB" role="button" aria-label="取っておく"><div id="keepl"></div><span>KEEP</span></div>
  </footer>
</div>
<div id="title">
  <a class="tPortal hidden" id="tPortal" href="/">‹ 一覧</a>
  <div class="tHero">
    <canvas id="tCv" aria-hidden="true"></canvas>
    <div class="tLogo">LAPIS</div>
    <button id="ver"></button>
    <div class="tBest" id="tBest"></div>
  </div>
  <div class="tMain">
    <button class="btn pri" id="tCont">続きから</button>
    <button class="btn" id="tNew">新しく始める</button>
  </div>
  <div class="tSub">
    <button id="tGal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3" fill="currentColor"/></svg>図鑑</button>
    <button id="tAch"><span style="font-size:24px;line-height:26px">🏆</span>実績</button>
    <button id="tSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>設定</button>
    <button id="tHelp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.7 2.7c-.7.3-1 .8-1 1.5v.6"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>遊び方</button>
  </div>
  <div id="a2hChip" class="hidden"><button id="a2hGo"><span style="font-size:22px">📲</span><span><b>ホーム画面に追加</b><small>全画面ですぐ遊べる</small></span><i>›</i></button><button id="a2hX" aria-label="閉じる">✕</button></div>
</div>
<div id="instOv" class="hidden">
  <div class="instBox">
    <img src="icon-192.png" alt="">
    <h1>LAPIS</h1>
    <p class="instLead">ホーム画面にアイコンを追加して<br>アプリとして遊びましょう</p>
    <ul class="instFx"><li><span>📱</span>全画面で遊べます</li><li><span>⚡</span>アイコンをタップするだけで、すぐ起動</li><li><span>📶</span>電波がないところでも遊べます</li></ul>
    <button class="btn pri" id="instGo">📲 ホーム画面に追加</button>
    <div id="instSteps"></div>
    <button class="instSkip" id="instSkip">今はブラウザで遊ぶ</button>
  </div>
</div>
<div class="ov" id="ov"><div class="panel" id="pn"></div></div>
<script>

function plusPiece(){const P=S.perks;const dk=P.dark?P.dark/30:(S.score>=750?1/90:0);return rnd()<dk?{t:'d'}:{t:'p'}}
const DUST0=200;
const CHAPS=[[5,'第一章','惑星の誕生'],[10,'第二章','星のめざめ'],[13,'第三章','星の一生'],[17,'第四章','重力の果て'],[18,'終章','銀河']];
function chapOf(v){let k=0;CHAPS.forEach((c,i)=>{if(v>=c[0])k=i+1});return k}
function checkChap(){if(tut)return;const k=chapOf(S.maxT);if(S.chap==null){S.chap=k;return}if(k>S.chap){S.chap=k;chapQ=k}}
let chapQ=0;function flushChap(){if(chapQ&&!S.pend&&!S.over){const k=chapQ;chapQ=0;setTimeout(()=>showChap(k),250)}}
function banner(h){const e=$('#chap');e.innerHTML=h;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function showChap(k){const c=CHAPS[k-1],d=beatDelay(.05,.5);sfx('chapter');setTimeout(()=>{banner(`<small>${c[1]}</small><b>${c[2]}</b>`);vib([20,60,20])},d*1000)}   // 見出しも次の拍の頭で
function gen(){
  const P=S.perks;
  if(S.forceP>0){S.forceP--;S.gsp=0;return plusPiece()}   // 加護「流れ星」の残り
  S.gsp++;S.gm=(S.gm||0)+1;
  const ex=Math.max(0,S.maxT-17);   // 銀河(18)を超えると宇宙が膨張: 彗星が減り、チリが増える
  const idl=S.ring.filter(o=>o.t==='p'||o.t==='d').length;   // 環で出番を待っている彗星の数
  const hold=idl>=2&&S.cap-S.ring.length>4;   // 待っている彗星が2つ以上で、まだ余裕があるときだけ、確率で出る分を止める(危ないときは止めない)
  if(S.gsp>=5+Math.min(3,ex)){S.gsp=0;return plusPiece()}   // 彗星は少なくとも5手に1回(本家と同じ。いつでも効く)
  if(S.gm>=(S.gmN||20)-3*(P.minus||0)){S.gm=0;S.gmN=18+Math.floor(rnd()*5);return{t:'m'}}   // ワームホールはほぼ20手ごと(本家と同じ)。序盤のすぐには来ない
  const pp=hold?0:Math.max(.05,.10-.02*ex)+.04*(P.plus||0);
  if(rnd()<pp){S.gsp=0;return plusPiece()}
  const low=1+Math.floor(S.moves/40);
  const vals=[...new Set(S.ring.filter(o=>o.t==='n').map(o=>o.v))];
  const lows=vals.filter(v=>v<low);
  let v;
  if(lows.length&&rnd()<1/vals.length)v=lows[Math.floor(rnd()*lows.length)];
  else v=(S.moves>DUST0&&rnd()<Math.min(.25+.03*ex,.4,(S.moves-DUST0)/2000+.03*ex))?(ex>20&&rnd()<(ex-20)/80?1+Math.floor(rnd()*(low-1)):1):low+Math.floor(rnd()*3);   // 38を超えると、チリに古い宇宙のかけら(ばらばらの小さな数)がまざりはじめる
  if(P.lift&&rnd()<.15*P.lift)v++;
  return{t:'n',v};
}
function newGame(){
  COL=0;endStop();GOSKIP=null;if(AU.hold||AU.end)bgmResume(1,.8);if(ACHWAIT)achRelease();
  achDay();
  S=blank();

  S.maxT=Math.max(...S.ring.map(o=>o.v));
  S.center=gen();S.queue=[gen()];
  disp={};ghosts=[];parts=[];fx=[];cS=.3;

}

/* ---------- 合体ロジック ---------- */
function canFuse(R,p){
  const n=R.length;if(n<3||p<0)return false;
  const L=R[(p-1+n)%n],Rt=R[(p+1)%n],o=R[p];
  if(L.t!=='n'||Rt.t!=='n')return false;
  if(o.t==='p')return L.v===Rt.v;
  return o.t==='d';
}
function pairAt(R,m){
  const n=R.length;if(n<3)return null;
  const li=(m-1+n)%n,ri=(m+1)%n;if(li===ri)return null;
  const A=R[li],B=R[ri];
  if(A.t!=='n'||B.t!=='n'||A.v!==B.v)return null;
  return{A,B,o:A.v};
}
function rm(R,arr){for(const o of arr){const k=R.indexOf(o);if(k>=0)R.splice(k,1)}}
function* fuseGen(R,p,perks,nid){
  const n=R.length,pl=R[p],L=R[(p-1+n)%n],Rt=R[(p+1)%n];
  const Z=Math.max(L.v,Rt.v);
  let c=pl.t==='p'?L.v+1:Z+1;
  const mid={id:nid(),t:'n',v:c};
  R[p]=mid;rm(R,[L,Rt]);
  let step=1;
  yield{step,cons:[L,Rt],from:pl,mid,gain:Math.floor(1.5*(Z+1))};
  for(;;){
    const pr=pairAt(R,R.indexOf(mid));if(!pr)break;
    step++;
    const M=1+.5*step,o=pr.o;
    const gain=Math.floor(M*(c+1))+(o>=c?Math.floor(2*M*(o-c+1)):0);
    c=o>=c?o+2:c+1;mid.v=c;rm(R,[pr.A,pr.B]);
    yield{step,cons:[pr.A,pr.B],mid,gain};
  }
}
function findPlus(R,first){
  if(first&&first.t!=='n'){const k=R.indexOf(first);if(canFuse(R,k))return k}
  return R.findIndex((o,k)=>o.t!=='n'&&canFuse(R,k));
}
function simulate(gi,piece){
  const R=S.ring.slice();const g={id:-1,t:piece.t,v:piece.v};R.splice(gi,0,g);
  const cons=new Set();let res=null,first=g,steps=0;
  for(let i=0;i<40;i++){
    const p=findPlus(R,first);first=null;if(p<0)break;
    for(const ev of fuseGen(R,p,S.perks,()=>-2)){ev.cons.forEach(o=>cons.add(o.id));res=ev.mid.v;steps=Math.max(steps,ev.step)}
  }
  return{cons,res,steps,ring:R};
}

/* ---------- 表示用の配置 ---------- */
const TAU=Math.PI*2;
function ang(k,n){return -Math.PI/2+TAU*k/n}
function gapAng(i,n){return n?ang(i-.5,n):-Math.PI/2}
function adiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
function syncDisp(){const n=S.ring.length;S.ring.forEach((o,k)=>{const ta=ang(k,n);let d=disp[o.id];if(!d)d=disp[o.id]={a:ta,r:1,s:1};d.ta=ta})}
function geo(){const n=S.ring.length,R=size*.36;return{cx:size/2,cy:size/2,R,pr:Math.min(size*.047,Math.PI*R/Math.max(n,1)*.62),cr:size*.06}}   // 星は小さめにして、宇宙の余白と軌道を見せる

/* ---------- 描画 ---------- */
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=k<0?0:255,f=Math.abs(k);r=Math.round(r+(t-r)*f);g=Math.round(g+(t-g)*f);b=Math.round(b+(t-b)*f);return`rgb(${r},${g},${b})`}

function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function bodyOf(v){return BODIES[(v-1)%BODIES.length]}
function bodyName(v){const g=Math.floor((v-1)/BODIES.length);return bodyOf(v)[0]+(g?' '+'✦'.repeat(Math.min(g,3)):'')}
function tint(hex,k){const n=parseInt(hex.slice(1),16);return'#'+[n>>16,n>>8&255,n&255].map(z=>Math.round(z+(255-z)*k).toString(16).padStart(2,'0')).join('')}

function hr(v,i){const s=Math.sin(v*12.9898+i*78.233)*43758.5453;return s-Math.floor(s)}
function lum(hex){const n=parseInt(hex.slice(1),16),f=z=>{z/=255;return z<=.03928?z/12.92:Math.pow((z+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)}
function disc(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
/* 縁の光: 皆既日食のコロナのように、ふわふわ漂う控えめなにじみ */
function corona(c,x,y,r,col,spread,seed,t,a0){
  for(let i=0;i<3;i++){
    const ph=t/(2600+i*900)+seed*6.283+i*2.1,off=r*.03,cx2=x+Math.cos(ph)*off,cy2=y+Math.sin(ph*1.3)*off;
    const sp=spread*(1+.12*Math.sin(t/1700+i+seed*9)),g=c.createRadialGradient(cx2,cy2,r*.92,cx2,cy2,r*(1+sp));
    g.addColorStop(0,rgba(col,a0*(.9+.1*Math.sin(t/1300+i))));g.addColorStop(.35,rgba(col,a0*.45));g.addColorStop(1,rgba(col,0));
    c.fillStyle=g;c.beginPath();c.arc(cx2,cy2,r*(1+sp),0,TAU);c.arc(cx2,cy2,r*.9,0,TAU,true);c.fill();   // 輪の部分だけ塗る(中は空けておく)
  }
}
/* 小さな衛星: 傾いた楕円軌道を回る点。奥側は星の後ろに隠れる */
function satPath(c,x,y,r,tilt,col,front){c.save();c.translate(x,y);c.rotate(tilt);c.lineWidth=Math.max(.8,r*.022);c.strokeStyle=rgba(col,.22);c.beginPath();c.ellipse(0,0,r*1.5,r*.42,0,front?0:Math.PI,front?Math.PI:TAU);c.stroke();c.restore()}
function satDot(c,x,y,r,tilt,ph,col,front){const sn=Math.sin(ph);if((sn>=0)!==front)return;const ex=Math.cos(ph)*r*1.5,ey=sn*r*.42,ct=Math.cos(tilt),st=Math.sin(tilt);const px=x+ex*ct-ey*st,py=y+ex*st+ey*ct,rr=Math.max(2.4,r*.15),g=c.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,rgba(col,.85));g.addColorStop(.3,rgba(col,.38));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(px,py,rr,0,TAU);c.fill()}
function sats(o,v){if(bodyOf(v)[0]==='環のある惑星')return 2;if(!o||o.id==null)return 0;const h=hr(o.id,97);return h<.06?2:h<.24?1:0}
function drawBody(c,x,y,r,v,t,o,noNum){
  t=t||0;const b=bodyOf(v),k=b[1],col=b[2],cor=corOf(v),g=Math.floor((v-1)/BODIES.length);
  const seed=o&&o.id!=null?hr(o.id,31):hr(v,31),ns=sats(o,v),tilt=-.35+(seed-.5)*.5,spd=t/(2600+seed*1300);
  c.save();
  corona(c,x,y,r*.9,cor,k==='p'?.1:k==='h'?.2:.14,seed,t,k==='p'?.22:k==='h'?.45:.3);
  if(g>=1){c.lineWidth=Math.max(.8,r*.035);c.strokeStyle=rgba('#e9cf86',.55);c.beginPath();c.arc(x,y,r*1.3,0,TAU);c.stroke()}
  if(g>=2){c.beginPath();c.arc(x,y,r*1.42,0,TAU);c.stroke()}
  if(ns){satPath(c,x,y,r,tilt,cor,false);for(let i=0;i<ns;i++)satDot(c,x,y,r,tilt,spd+i*Math.PI*.9,tint(cor,.5),false)}
  disc(c,x,y,r*.9,col);

  if(noNum){c.restore();return}
  const s=String(v),fs=r*(s.length>1?.76:.92),dark=lum(col)>.42;
  c.font=`800 ${fs}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';

/* ＋＝彗星: 光る小さな核と、進む向きと反対へ流れる短い尾。黒い＋＝暗黒彗星 */
const TAIL0=Math.PI*.75;   // 中央など、向きのない場所では左下へ尾を引く
function drawComet(c,x,y,r,dark,ta,t){
  ta=ta==null?TAIL0:ta;t=t||0;
  const core=dark?'#2a2142':'#ff9476',tl=dark?'#a58cff':'#ffc2a8',L=r*(1.55+.08*Math.sin(t/500)),W=r*.42;
  c.save();c.translate(x,y);c.rotate(ta);

  c.fillStyle=g;c.beginPath();c.moveTo(0,-W);c.quadraticCurveTo(L*.55,-W*.35,L,0);c.quadraticCurveTo(L*.55,W*.35,0,W);c.closePath();c.fill();
  c.restore();

  disc(c,x,y,r*.5,core);
  if(dark){c.lineWidth=Math.max(1.2,r*.06);c.strokeStyle=tl;c.stroke()}
  c.strokeStyle=dark?'#e3dbff':'#ffffff';c.lineWidth=r*.12;c.lineCap='round';c.beginPath();c.moveTo(x-r*.22,y);c.lineTo(x+r*.22,y);c.moveTo(x,y-r*.22);c.lineTo(x,y+r*.22);c.stroke();c.lineCap='butt';

/* －＝ワームホール: 中が空洞のリング。縁がゆっくり渦を巻く */

  c.lineWidth=Math.max(1,r*.06);c.lineCap='round';
  for(let i=0;i<3;i++){const a=t/900+i*TAU/3;c.strokeStyle=rgba(lt,.65-i*.12);c.beginPath();c.arc(x,y,r*.5,a,a+1.3);c.stroke()}
  c.strokeStyle='#ffffff';c.lineWidth=r*.12;c.beginPath();c.moveTo(x-r*.2,y);c.lineTo(x+r*.2,y);c.stroke();
  c.restore();

function drawPiece(c,o,x,y,r,ta){
  if(o.t==='n')drawBody(c,x,y,r,o.v,NOW,o);

function paintMini(el,o,px){const d=Math.min(window.devicePixelRatio||1,3);el.width=el.height=Math.round(px*d);const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,px,px);if(o)drawPiece(c,o,px/2,px/2-px*.03,px*.36)}

// ---------- 危機: のこり2つで重力が強まり、のこり1つでさらに強く ----------
let DZ=0;const HB={next:0,beat:0,pulse:0,op:-1};
function dangerLv(){if(onTitle||!S||S.over||COL||tut)return 0;const rem=S.cap-S.ring.length;return rem<=1?2:rem<=2?1:0}
function heartbeat(lv,when=0,gap=.2){if(!AC||!SET.sound)return;if(window.__SL)window.__SL.push(['heart',lv,AC.currentTime+when]);const v=lv===2?1:.7;   // ドクン、ドクン(低い音と、スマホでも聞こえる少し高い音)
  [[0,1],[gap,.6]].forEach(([w,a])=>{tone(62,.2,'sine',.26*v*a,when+w,.65);tone(124,.12,'sine',.07*v*a,when+w,.6)})}
function bgmMuffle(lv){if(!AC||!AU.warm||AU.end)return;const f=lv===2?900:lv===1?1700:5200;if(AU.muf!==f){AU.warm.frequency.setTargetAtTime(f,AC.currentTime,.5);AU.muf=f}}   // 危ないときは曲がこもって遠くなる
function dangerStep(){
  const lv=dangerLv(),now=performance.now();DZ+=((lv===2?1:lv===1?.55:0)-DZ)*.04;if(DZ<.003)DZ=0;
  let per=lv===2?1000:1450;
  if(lv&&synced()){   // 曲が鳴っていれば拍に合わせる: のこり2つは2拍ごと、のこり1つは1拍ごと。「ドクン」の2つ目は16分あと
    const st=lv===2?.5:.25;per=BGM_STEP/st*1000;
    if(!HB.ac||HB.ac<AC.currentTime-.05)HB.ac=beatAt(.05,st);
    if(HB.ac-AC.currentTime<.12){const w=HB.ac-AC.currentTime;heartbeat(lv,w,BGM_STEP/2);HB.pend=now+w*1000;HB.ac=beatAt(w+.05,st)}
    if(HB.pend&&now>=HB.pend){HB.beat=HB.pend;HB.pend=0}HB.next=0;
  }else if(lv){HB.ac=0;if(!HB.next)HB.next=now+120;if(now>=HB.next){HB.beat=now;HB.next=now+per;heartbeat(lv)}}else{HB.next=0;HB.ac=0;HB.pend=0}
  const ph=HB.beat?(now-HB.beat)/per:9;HB.pulse=lv?Math.max(Math.exp(-ph*8),ph>.2?.7*Math.exp(-(ph-.2)*8):0):0;
  const op=+(DZ*(.5+.5*HB.pulse)).toFixed(3);if(op!==HB.op){$('#warn').style.opacity=op;HB.op=op}
  bgmMuffle(lv);

let orb=[];   // 軌道の光: rip=置いたときの波紋 / run=連鎖で軌道を走る光 / wave=合体点の小さな輪
function drawOrb(c,cx,cy,R,pr){

  orb=orb.filter(e=>{
    const k=(now-e.t0)/e.dur;if(k>=1)return false;const a=e.a+ROT;
    if(e.k==='rip'){const sp=.15+k*.9,al=.16*(1-k);c.lineWidth=1.4;c.strokeStyle=`rgba(200,215,255,${al})`;[1,-1].forEach(sg=>{c.beginPath();c.arc(cx,cy,R,a+sg*sp-.09,a+sg*sp+.09);c.stroke()})}
    else if(e.k==='run'){const head=k*1.7,fade=1-k;for(let j=0;j<14;j++){const al=e.amp*fade*Math.pow(1-j/14,1.5),w=.5+1.8*(1-j/14);c.lineWidth=w;c.strokeStyle=`rgba(255,228,180,${al})`;[1,-1].forEach(sg=>{const h=a+sg*(head-j*.035);c.beginPath();c.arc(cx,cy,R,Math.min(h,h-sg*.036),Math.max(h,h-sg*.036));c.stroke()})}}

    return true});
  c.restore();
}
function draw(t){
  const c=ctx;c.clearRect(0,0,size,size);
  if(!S)return;
  const n=S.ring.length,{cx,cy,R,pr,cr}=geo();
  NOW=t;const dt=lastT?Math.min(100,t-lastT):0;lastT=t;
  const cp=COL?Math.max(0,Math.min(1,(t-COL)/((RM0||RM_FORCE)?600:COL_MS))):0,cin=cp*cp*cp;   // 重力崩壊: 回転が速くなり、星が中心へ吸い込まれる
  if(!pdown&&!RM_FORCE)ROT=(ROT+dt*TAU/360000*(1+60*cp*cp))%TAU;
  if(REW){const k=(t-REW)/900;if(k>=1||k<0)REW=0;else ROT=(ROT-dt*TAU/700*(1-k)*(1-k)+TAU)%TAU}   // 巻き戻るときは、環がすっと逆に回る   // ふだんは約6分で1周(ゆっくりなので動きを減らす設定でも回す)、押している間は止める
  const P=(a,rr)=>({x:cx+Math.cos(a+ROT)*rr,y:cy+Math.sin(a+ROT)*rr});

  drawOrb(c,cx,cy,R,pr);

  const gR=R+pr+size*.04,fr=Math.min(1,n/S.cap);

function csShare(ok){try{localStorage.setItem('tkcy3_consent_v1',JSON.stringify({v:1,ok:ok?1:0,at:Date.now()}));localStorage.setItem('tkcy3_share',ok?'1':'0')}catch(e){}}
function csAdopt(){
  const c=csShared();if(!c)return;
  if(ST.consent===undefined||(c.ok&&ST.consent!==1))ST.consent=c.ok?1:0;
  let sh=null;try{sh=localStorage.getItem('tkcy3_share')}catch(e){}

/* ---------- BGM: チルな宇宙のオリジナル曲(ニ長調・62bpm・8小節 約31秒でループ)。遠いパッド、やわらかいエレピ、ガラスのような高い音を深い残響で。音源ファイルなし ---------- */
const BGM_VOL=[0,.5,.85,1.25],BGM_STEP=60/62/2;   // 8分音符
// コード: Gmaj9 F#m7 Em9 A13sus / Gmaj9 F#m11 Bm9 A6sus ([ベース, 和音])
const BGM_CH=[[43,[59,62,66,69]],[42,[57,61,64,69]],[40,[55,59,62,66]],[45,[55,59,64,66]],
              [43,[59,62,66,69]],[42,[57,61,64,71]],[47,[57,61,62,66]],[45,[54,59,62,64]]];
const BGM_MEL=[[[0,78],[2.5,76]],[[1,73]],[[0,74],[1.5,76],[3,78]],[[2,76]],
               [[0,81],[2,78]],[[1,76],[2.5,73]],[[0,74],[2,73]],[[1,69]]];   // [拍, 音]
const AU={out:null,bus:null,rv:null,playing:false,timer:0,next:0,step:0,loop:0,ch:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function auIR(sec,decay){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
function auOut(){if(!AC)return null;if(!AU.out){
  AU.out=AC.createGain();AU.out.gain.value=BGM_VOL[SET.bgm||0];const warm=AU.warm=AC.createBiquadFilter();warm.type='lowpass';warm.frequency.value=5200;warm.Q.value=.3;AU.out.connect(warm);warm.connect(AC.destination);
  AU.bus=AC.createGain();AU.bus.gain.value=.9;AU.bus.connect(AU.out);
  AU.rv=AC.createConvolver();AU.rv.buffer=auIR(4.5,2.2);const rg=AC.createGain();rg.gain.value=.5;AU.rv.connect(rg);rg.connect(AU.out)}return AU.out}
function auSend(node,amt){const g=AC.createGain();g.gain.value=amt;node.connect(g);g.connect(AU.rv)}
function auPan(){return AC.createStereoPanner?AC.createStereoPanner():AC.createGain()}
function bEp(m,t,d,vel){   // エレピ(FM): やわらかいアタックとゆっくり消える響き、かすかに左右へゆれる
  const f=mtof(m),car=AC.createOscillator(),mod=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain(),pan=auPan();
  car.frequency.value=f;mod.frequency.value=f;mg.gain.setValueAtTime(f*1.1*vel,t);mg.gain.exponentialRampToValueAtTime(f*.05,t+.9);mod.connect(mg);mg.connect(car.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05*vel,t+.012);g.gain.exponentialRampToValueAtTime(.022*vel,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  const os=[car,mod];if(pan.pan){const tr=AC.createOscillator(),tg=AC.createGain();tr.frequency.value=4.2;tg.gain.value=.25;tr.connect(tg);tg.connect(pan.pan);os.push(tr)}
  car.connect(g);g.connect(pan);pan.connect(AU.bus);auSend(pan,.6);os.forEach(o=>{o.start(t);o.stop(t+d+.1)});
}
function bPad(ms,t,d){ms.forEach(m=>[-7,7].forEach(dt=>{const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt;
  f.type='lowpass';f.frequency.value=520;f.Q.value=.2;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.0055,t+d*.45);g.gain.linearRampToValueAtTime(.0001,t+d+1.2);
  o.connect(f);f.connect(g);g.connect(AU.bus);auSend(g,.9);o.start(t);o.stop(t+d+1.3)}))}
function bBass(m,t,d){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=mtof(m);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.bus);o.start(t);o.stop(t+d+.05)}
function bGlass(m,t,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),pan=auPan();o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*3.01;if(pan.pan)pan.pan.value=Math.sin(m*1.7)*.4;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.028*v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
  g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.004*v,t+.01);g2.gain.exponentialRampToValueAtTime(.0001,t+.8);
  o.connect(g);o2.connect(g2);g.connect(pan);g2.connect(pan);pan.connect(AU.bus);auSend(pan,1.1);[o,o2].forEach(x=>{x.start(t);x.stop(t+3.3)})}
function bgmStep(i,t){
  const bar=i>>3,pos=i&7,[root,v]=BGM_CH[bar],beat=BGM_STEP*2,barLen=beat*4;
  if(pos===0){AU.ch=v;bPad(v.map(x=>x-12),t,barLen);bBass(root-12+(root<41?12:0),t,barLen*.9);v.forEach((m,j)=>bEp(m,t+j*.028,3.6,.8))}
  if(pos===5)v.forEach((m,j)=>bEp(m,t+j*.028+beat*.02,2.2,.55));
  for(const [p,m] of BGM_MEL[bar])if(p*2===pos&&!(AU.loop%2===0&&Math.random()<.35))bGlass(m+12,t,.9);   // メロディは1周おきに少し間引く
}
function bgmSched(){if(!AC||AU.hold)return;auOut();while(AU.next<AC.currentTime+.3){bgmStep(AU.step,AU.next);AU.step=(AU.step+1)%64;if(!AU.step)AU.loop++;
  if(AU.rit){AU.next+=BGM_STEP*(1+.07*AU.rit.n);if(++AU.rit.n>=AU.rit.max){AU.rit=null;AU.hold=true;break}}else AU.next+=BGM_STEP}}   // AU.rit: 終わりの音でテンポをゆるめ、決めた数だけ鳴らして止める
function bgmStart(){ac();if(!AC||AU.playing)return;AU.playing=true;AU.step=0;AU.loop=0;AU.next=AC.currentTime+.2;AU.timer=setInterval(bgmSched,25)}
function bgmStop(){AU.playing=false;clearInterval(AU.timer)}
function bgmResume(to,sec){   // 終わりの音のあと、曲を頭から小さく戻す(こもり・響き・音量も元に)
  if(!AU.hold&&!AU.end)return bgmFade(to,sec);AU.hold=false;AU.end=false;AU.rit=null;if(!AC||!AU.out)return;AU.step=0;AU.loop=0;AU.next=AC.currentTime+.15;
  try{const n=AC.currentTime;AU.bus.gain.cancelScheduledValues(n);AU.bus.gain.setValueAtTime(.9,n);AU.warm.frequency.cancelScheduledValues(n);AU.warm.frequency.setValueAtTime(5200,n);AU.muf=5200;if(AU.wet){AU.wet.disconnect();AU.wet=null}}catch(e){}
  const g=AU.out.gain;try{g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(.0001,AC.currentTime);g.linearRampToValueAtTime(BGM_VOL[SET.bgm||0]*to,AC.currentTime+sec)}catch(e){}}
function bgmFade(to,sec){if(!AC||!AU.out)return;const g=AU.out.gain,v=to?BGM_VOL[SET.bgm||0]*to:0;try{g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(g.value,AC.currentTime);g.linearRampToValueAtTime(v,AC.currentTime+sec)}catch(e){g.value=v}}
function bgmApply(){if(!SET.bgm){bgmStop();return}bgmStart();const o=auOut();if(o)o.gain.value=BGM_VOL[SET.bgm]}
// ブラウザは最初のタップまで音を出せないので、BGMは最初のタッチで始まる
document.addEventListener('pointerdown',()=>{if(SET.bgm&&!AU.playing)bgmStart()},true);

function setTip(txt,skip){tipEl.innerHTML='<span>'+txt+'</span>'+(skip?'<button id="skipB">スキップ</button>':'');if(skip)$('#skipB').onclick=()=>{tutEnd()}}
function flashTip(txt){tipLock=Date.now()+2600;setTip(txt);setTimeout(()=>{if(Date.now()>=tipLock)refresh()},2700)}
function refresh(){
  if(!S)return;
  $('#score').textContent=S.score;
  $('#bestl').textContent='BEST '+Math.max(ST.best,tut?0:S.score);
  paintMini($('#maxc'),{t:'n',v:tut?1:S.maxT},44);
  const nl=$('#nextl');
  while(nl.children.length<S.queue.length)nl.appendChild(document.createElement('canvas'));
  while(nl.children.length>S.queue.length)nl.lastChild.remove();
  S.queue.forEach((q,i)=>paintMini(nl.children[i],q,44));
  $('#perkl').innerHTML=Object.keys(S.perks).filter(k=>k!=='clean').map(k=>`<button class="pk" data-k="${k}" aria-label="${PERKS[k].n}">${icon(k)}${S.perks[k]>1?`<b>${S.perks[k]}</b>`:''}</button>`).join('');
  document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>flashTip(PERKS[b.dataset.k].n+'<br><small>'+PERKS[b.dataset.k].d+'</small>'));
  const kl=$('#keepl'),hn=tut?1:holdN();if(!S.hold)S.hold=[];
  while(kl.children.length<hn)kl.appendChild(document.createElement('canvas'));
  while(kl.children.length>hn)kl.lastChild.remove();
  [...kl.children].forEach((cv,i)=>{const o=S.hold[i];paintMini(cv,o||null,44);if(!o){const c=cv.getContext('2d');c.setLineDash([3,4]);c.lineWidth=1.5;c.strokeStyle='rgba(170,181,216,.45)';c.beginPath();c.arc(22,22-44*.03,44*.3,0,TAU);c.stroke()}});
  const kb=$('#keepB'),tk=!!(tut&&TUT[tut.step]&&TUT[tut.step].act.k==='keep');kb.classList.toggle('off',(!!tut&&!tk)||!!S.over||!!S.kept);kb.classList.toggle('tut',tk&&!busy);
  kb.classList.toggle('hint',!tut&&!S.over&&!S.kept&&S.cap-S.ring.length<=2&&S.hold.some(o=>o&&(o.t==='p'||o.t==='d'))&&!(S.center&&(S.center.t==='p'||S.center.t==='d')));   // ピンチで彗星をしまっているときは光って知らせる
  if(tut||Date.now()<tipLock)return;
  const c=S.center;
  if(!c||S.over)setTip('');
  else if(c.t==='m')setTip('吸い込む星をタップ');
  else if(c.abs&&c.t==='n')setTip('まん中をタップで彗星＋に変わる');

}

function startTut(prev){
  saved=prev;tut={step:0};
  S=blank();S.queue=[{t:'n',v:1}];
  tutSet();
}
function tutSet(){
  const d=TUT[tut.step];
  if(!d.keep){S.ring=d.ring.map(v=>({id:S.nid++,t:'n',v}));S.center={...d.center};S.hold=[];S.kept=false;disp={};ghosts=[];syncDisp();cS=.3}

}

const FLY={c:null,W:0,H:0,items:[],dirty:false,next:{star:0,sat:0,ufo:0}};
function flyInit(){const el=$('#fly'),d=Math.min(window.devicePixelRatio||1,2);FLY.W=innerWidth;FLY.H=innerHeight;el.width=FLY.W*d;el.height=FLY.H*d;FLY.c=el.getContext('2d');FLY.c.setTransform(d,0,0,d,0,0);FLY.dirty=true}
function flySpawn(k){const now=performance.now(),W=FLY.W,H=FLY.H,R=Math.random,dir=R()<.5?1:-1;
  if(k==='star'){const a=(.18+R()*.25),x=W*(.2+R()*.6),y=H*(.06+R()*.1);FLY.items.push({k,t0:now,dur:800+R()*350,x,y,vx:dir*Math.cos(a),vy:Math.sin(a),len:60+R()*60,dist:170+R()*110})}   // 盤の上の空いた空だけを流れる
  else if(k==='sat'){const y0=H*(.07+R()*.15),y1=y0+H*(R()-.5)*.08;FLY.items.push({k,t0:now,dur:32000+R()*14000,x0:dir>0?-10:W+10,x1:dir>0?W+10:-10,y0,y1,fl:.3+R()*.4})}
  else if(k==='ufo'){try{if(!document.hidden)setTimeout(()=>achGive('ufo'),5000)}catch(e){}const y=H*(.1+R()*.08);FLY.items.push({k,t0:now,dur:11000,x0:dir>0?-30:W+30,dir,y,stop:.38+R()*.2})}}
function flyStep(){
  const c=FLY.c;if(!c)return;const now=performance.now(),R=Math.random,N=FLY.next;
  if(!N.star){N.star=now+15000+R()*25000;N.sat=now+90000+R()*120000;N.ufo=now+480000+R()*600000}
  if(!document.hidden){if(now>N.star){flySpawn('star');N.star=now+30000+R()*60000}
    if(now>N.sat){flySpawn('sat');N.sat=now+150000+R()*150000}
    if(now>N.ufo){if(R()<.5)flySpawn('ufo');N.ufo=now+600000+R()*900000}}
  if(!FLY.items.length&&!FLY.dirty)return;
  c.clearRect(0,0,FLY.W,FLY.H);FLY.dirty=FLY.items.length>0;
  FLY.items=FLY.items.filter(o=>{const k=(now-o.t0)/o.dur;if(k>=1)return false;
    if(o.k==='star'){const e=1-Math.pow(1-k,2),hx=o.x+o.vx*o.dist*e,hy=o.y+o.vy*o.dist*e,al=Math.sin(Math.PI*k)*.85,tl=o.len*(.4+.6*Math.sin(Math.PI*Math.min(1,k*1.4)));
      const g=c.createLinearGradient(hx,hy,hx-o.vx*tl,hy-o.vy*tl);g.addColorStop(0,`rgba(235,242,255,${al})`);g.addColorStop(1,'rgba(200,215,255,0)');
      c.strokeStyle=g;c.lineWidth=1.4;c.lineCap='round';c.beginPath();c.moveTo(hx,hy);c.lineTo(hx-o.vx*tl,hy-o.vy*tl);c.stroke();c.fillStyle=`rgba(245,248,255,${al})`;c.beginPath();c.arc(hx,hy,1.3,0,TAU);c.fill()}
    else if(o.k==='sat'){const x=o.x0+(o.x1-o.x0)*k,y=o.y0+(o.y1-o.y0)*k,fl=Math.exp(-Math.pow((k-o.fl)/.03,2));   // 途中で一度だけ、ふっと明るく光る
      const al=Math.min(1,k*12,(1-k)*12)*(.45+.5*fl);c.fillStyle=`rgba(232,238,255,${al})`;c.beginPath();c.arc(x,y,1.1+1.4*fl,0,TAU);c.fill();
      if(fl>.05){const g=c.createRadialGradient(x,y,0,x,y,9);g.addColorStop(0,`rgba(232,238,255,${.35*fl})`);g.addColorStop(1,'rgba(232,238,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,9,0,TAU);c.fill()}}
    else if(o.k==='ufo'){   // ゆっくり来て、少し止まって、すっと去る
      const W=FLY.W,cxm=W*(o.dir>0?o.stop:1-o.stop);let x,a=1;
      if(k<.5){const q=k/.5;x=o.x0+(cxm-o.x0)*(1-Math.pow(1-q,2))}else if(k<.68)x=cxm;else{const q=(k-.68)/.32;x=cxm+o.dir*(W+80)*q*q*q;a=1-q*.3}
      const y=o.y+Math.sin(now/520)*3,al=.55*a*Math.min(1,k*8,(1-k)*8);c.save();c.globalAlpha=al;
      c.fillStyle='#9fd8cc';c.beginPath();c.ellipse(x,y-3,5,4,0,Math.PI,TAU);c.fill();
      c.fillStyle='#c9d2f0';c.beginPath();c.ellipse(x,y,13,3.6,0,0,TAU);c.fill();
